name: Forgewatch tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out Forgewatch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Forgewatch and pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install . semgrep==1.177.0
          mkdir -p "$RUNNER_TEMP/forgewatch-bin" "$RUNNER_TEMP/forgewatch-downloads"
          cd "$RUNNER_TEMP/forgewatch-downloads"
          curl --fail --location --silent --show-error --output osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          curl --fail --location --silent --show-error --output osv-checksums https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_SHA256SUMS
          grep 'osv-scanner_linux_amd64$' osv-checksums | sed 's/osv-scanner_linux_amd64/osv-scanner/' | sha256sum --check --strict
          install -m 0755 osv-scanner "$RUNNER_TEMP/forgewatch-bin/osv-scanner"
          curl --fail --location --silent --show-error --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error --output gitleaks-checksums https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks-checksums | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tar.gz/' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/forgewatch-bin/gitleaks"
          echo "$RUNNER_TEMP/forgewatch-bin" >> "$GITHUB_PATH"

      - name: Run unit tests and compile Python files
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m compileall -q forgewatch scripts tests

      - name: Build the Python package
        shell: bash
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/forgewatch-wheel"

      - name: Run the real-scanner security fixture
        shell: bash
        run: python scripts/demo.py

      - name: Upload the demonstration report and patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgewatch-test-${{ github.run_id }}
          path: .forgewatch/artifacts/demo-fixture/
          if-no-files-found: error
          retention-days: 14
