name: Forgewatch scan

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Target repository owner
        required: true
        default: 1Kelv
      repository:
        description: Target repository name
        required: true
        default: forgewatch
      revision:
        description: Commit SHA, branch or tag
        required: true
        default: main
      ref:
        description: Ref recorded in the report
        required: true
        default: main
      default_branch:
        description: Target default branch
        required: true
        default: main
      trigger:
        description: Trigger recorded in the report
        required: true
        type: choice
        options: [manual, push, pull_request, schedule, webhook]
        default: manual
  repository_dispatch:
    types: [forgewatch_scan]

permissions:
  contents: read

concurrency:
  group: forgewatch-${{ github.event.client_payload.repository || format('{0}/{1}', inputs.owner || vars.FORGEWATCH_TARGET_OWNER || github.repository_owner, inputs.repository || vars.FORGEWATCH_TARGET_REPOSITORY || github.event.repository.name) }}-${{ github.event.client_payload.commit || inputs.revision || github.sha }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_OWNER: ${{ github.event.client_payload.target_owner || inputs.owner || vars.FORGEWATCH_TARGET_OWNER || github.repository_owner }}
      TARGET_NAME: ${{ github.event.client_payload.target_name || inputs.repository || vars.FORGEWATCH_TARGET_REPOSITORY || github.event.repository.name }}
      TARGET_REPOSITORY: ${{ github.event.client_payload.repository || format('{0}/{1}', inputs.owner || vars.FORGEWATCH_TARGET_OWNER || github.repository_owner, inputs.repository || vars.FORGEWATCH_TARGET_REPOSITORY || github.event.repository.name) }}
      TARGET_REVISION: ${{ github.event.client_payload.commit || inputs.revision || github.sha }}
      TARGET_REF: ${{ github.event.client_payload.ref || inputs.ref || github.ref_name }}
      TARGET_DEFAULT_BRANCH: ${{ github.event.client_payload.default_branch || inputs.default_branch || vars.FORGEWATCH_TARGET_DEFAULT_BRANCH || github.event.repository.default_branch }}
      SCAN_TRIGGER: ${{ github.event.client_payload.trigger || inputs.trigger || 'schedule' }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out Forgewatch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: forgewatch
          persist-credentials: false

      - name: Detect optional GitHub App credentials
        id: app-config
        shell: bash
        env:
          APP_ID: ${{ secrets.FORGEWATCH_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FORGEWATCH_APP_PRIVATE_KEY }}
          TARGET_TOKEN: ${{ secrets.FORGEWATCH_TARGET_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$TARGET_TOKEN" ]]; then
            echo "target_token_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "target_token_configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain missing access to a private target
        if: env.TARGET_REPOSITORY != github.repository && steps.app-config.outputs.configured != 'true' && steps.app-config.outputs.target_token_configured != 'true'
        shell: bash
        env:
          PUBLIC_REPOSITORY_API: https://api.github.com/repos/${{ env.TARGET_REPOSITORY }}
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error --location "$PUBLIC_REPOSITORY_API" > /dev/null; then
            exit 0
          fi
          echo "::error::Forgewatch cannot read ${TARGET_REPOSITORY}. The repository is private or does not exist. For a private target, install the Forgewatch GitHub App on that repository or add a read-only FORGEWATCH_TARGET_TOKEN secret to the 1Kelv/forgewatch repository."
          exit 1

      - name: Mint a target-scoped GitHub App token
        if: steps.app-config.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.FORGEWATCH_APP_ID }}
          private-key: ${{ secrets.FORGEWATCH_APP_PRIVATE_KEY }}
          owner: ${{ env.TARGET_OWNER }}
          repositories: ${{ env.TARGET_NAME }}

      - name: Check out Forgewatch as the target
        if: env.TARGET_REPOSITORY == github.repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_REVISION }}
          token: ${{ github.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Check out another target repository
        if: env.TARGET_REPOSITORY != github.repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_REVISION }}
          token: ${{ steps.app-token.outputs.token || secrets.FORGEWATCH_TARGET_TOKEN || github.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forgewatch/pyproject.toml

      - name: Restore finding history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: forgewatch/.forgewatch/state.db
          key: forgewatch-state-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            forgewatch-state-${{ github.repository_id }}-

      - name: Install the pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./forgewatch semgrep==1.177.0
          mkdir -p "$RUNNER_TEMP/forgewatch-bin" "$RUNNER_TEMP/forgewatch-downloads"
          cd "$RUNNER_TEMP/forgewatch-downloads"
          curl --fail --location --silent --show-error --output osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          curl --fail --location --silent --show-error --output osv-checksums https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_SHA256SUMS
          grep 'osv-scanner_linux_amd64$' osv-checksums | sed 's/osv-scanner_linux_amd64/osv-scanner/' | sha256sum --check --strict
          install -m 0755 osv-scanner "$RUNNER_TEMP/forgewatch-bin/osv-scanner"
          curl --fail --location --silent --show-error --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error --output gitleaks-checksums https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks-checksums | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tar.gz/' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/forgewatch-bin/gitleaks"
          echo "$RUNNER_TEMP/forgewatch-bin" >> "$GITHUB_PATH"

      - name: Bootstrap target dependencies without lifecycle scripts
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts
          fi

      - name: Scan and prepare supported fixes
        id: scan
        shell: bash
        run: |
          set +e
          forgewatch \
            --root "$GITHUB_WORKSPACE/target" \
            --config "$GITHUB_WORKSPACE/forgewatch/forgewatch.example.json" \
            --repository "$TARGET_REPOSITORY" \
            --default-branch "$TARGET_DEFAULT_BRANCH" \
            scan \
            --trigger "$SCAN_TRIGGER" \
            --ref "$TARGET_REF" \
            --report-dir ".forgewatch/artifacts/run-${GITHUB_RUN_ID}" \
            --prepare-fixes \
            --fail-on high
          scan_exit_code=$?
          set -e
          echo "exit_code=$scan_exit_code" >> "$GITHUB_OUTPUT"
          if [[ "$scan_exit_code" == "0" ]]; then
            echo "### Scan completed: no important finding reached the failure threshold" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$scan_exit_code" == "1" ]]; then
            echo "::warning::The scan completed and found important items to review. Open the uploaded scan.md report."
            echo "### Scan completed: important items need review" >> "$GITHUB_STEP_SUMMARY"
            echo "The scanners finished normally. Download the report artifact and open scan.md for the plain-English results." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The scan was incomplete. Open scan.md to see which check could not finish."
            echo "### Scan incomplete" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save finding history
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: forgewatch/.forgewatch/state.db
          key: forgewatch-state-${{ github.repository_id }}-${{ github.run_id }}

      - name: Upload reports and patch candidates
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgewatch-${{ github.run_id }}
          path: forgewatch/.forgewatch/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Fail only when the scan was incomplete
        if: steps.scan.outcome != 'skipped' && steps.scan.outputs.exit_code != '0' && steps.scan.outputs.exit_code != '1'
        shell: bash
        run: exit 1
